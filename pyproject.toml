[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-tools"
version = "0.1.0"
description = "QingCloud command line tools for AI agents (AppCenter, IaaS, ...)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "QingCloud" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
appcenter = "appcenter_cli.cli:main"
iaas = "iaas_cli.cli:main"

[tool.setuptools.packages.find]
include = ["qc_cli*", "appcenter_cli*", "iaas_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
